<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Float Layout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <div class="block left"></div>
    <div class="block right"></div>
  </div>

  <div class="container">
    <div class="block left"></div>
    <div class="block right"></div>
    <div class="block right"></div>
    <div class="block right"></div>
  </div>

  <div class="container">
    <div class="block left"></div>
    <div class="block left"></div>
    <div class="block right"></div>
    <div class="block right"></div>
  </div>

  <div class="container tall">
    <div class="block left"></div>
    <div class="block right"></div>
    <div class="block right clear-right"></div>
  </div>

  <div class="center-wrapper">
    <div class="block float-left"></div>
    <div class="block float-left clear-left"></div>
    <div class="block float-left"></div>
  </div>

</body>
</html>
